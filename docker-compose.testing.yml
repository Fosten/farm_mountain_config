services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: farm
      POSTGRES_PASSWORD: farm
      POSTGRES_DB: farm

  www:
    depends_on:
      - db
    image: farmos/farmos:4.x-dev
    ports:
      - '80:80'
    volumes:
      - './:/opt/drupal/web/modules/custom/farm_mountain_config'
